name: Laravel CI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        run: |
          # 1. Store the deployment key safely on the runner
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key
          chmod 600 private_key

          # 2. Connect to EC2 and execute initialization scripts
          ssh -o StrictHostKeyChecking=no \
            -i private_key \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cd /var/www/laravel-hms && \
             
             # 3. Smart Code Sync with Permissions Elevation
             if [ ! -d .git ]; then \
               echo 'First time deployment: Cloning repository contents...'; \
               git clone https://github.com/obaidwazeer/laravel-hms.git . && \
               git checkout main; \
             else \
               echo 'Subsequent deployment: Resetting folder ownership to enable file writes...'; \
               sudo chown -R ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} storage bootstrap/cache && \
               echo 'Fetching and merging latest changes...'; \
               git fetch origin && \
               git reset --hard origin/main; \
             fi && \
             
             # 4. Generate the .env file dynamically if it is missing
             if [ ! -f .env ]; then \
               echo 'Creating .env file from template...' && \
               cp .env.example .env && \
               
               # 5. Escaped the inner quotes cleanly for the bash shell interpreter
               sed -i 's/DB_DATABASE=.*/DB_DATABASE=${{ secrets.DB_DATABASE }}/' .env && \
               sed -i 's/DB_USERNAME=.*/DB_USERNAME=${{ secrets.DB_USERNAME }}/' .env && \
               sed -i \"s/DB_PASSWORD=.*/DB_PASSWORD='${{ secrets.DB_PASSWORD }}'/\" .env; \
             fi && \
             
             # 6. Run Composer Install
             composer install --no-dev --optimize-autoloader --ignore-platform-reqs && \
             
             # 7. Execute Artisan optimization pipeline and hand over storage permissions back to Nginx
             if [ ! -f .env_key_built ]; then \
               php artisan key:generate && \
               touch .env_key_built; \
             fi && \
             
             php artisan migrate --force && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache && \
             sudo chown -R www-data:www-data storage bootstrap/cache"
