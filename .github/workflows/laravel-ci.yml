name: Laravel CI
on:
  push:
    branches:
      - main
jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: install composer denpendencies
        run: composer install --no-interaction --prefer-dist

      - name: Run laravel test
        run: php artisan test
